/* =========================================================
   LÓGICA DE NEGOCIO
   ========================================================= */
const byFolio = f => S.orders.find(o => o.folio === f);
const invOf = id => S.inv.find(i => i.id === id);
const latest = o => o.pres[o.pres.length - 1];
const accepted = o => [...o.pres].reverse().find(p => p.estado === 'aceptado');
const lineTotal = r => r.propia ? 0 : r.p * r.c;
const presTotal = p => p ? sum(p.mo.map(m => +m.p || 0)) + sum(p.ref.map(lineTotal)) : 0;
const total = o => presTotal(accepted(o));
const opById = id => S.ops.find(x => x.id === id);
const payEstado = p => p.opId ? (opById(p.opId)?.estado || p.estado) : p.estado;
const pagado = o => sum(o.pagos.filter(p => payEstado(p) === 'guardado').map(p => p.monto));
const saldo = o => Math.max(0, total(o) - pagado(o));
/* Cuenta activa en el mostrador y permisos */
const me = () => ROLES[S.role].nombre;
const can = p => ROLES[S.role].perms.includes(p);
const canView = v => !VIEW_PERM[v] || can(VIEW_PERM[v]);
const soloOscar = p => toast(`Solo Óscar puede ${PERM_TXT[p] || 'hacer esto'}. Cambia a su cuenta para continuar.`, 'warn');
/* Cancelada: queda abierta mientras falte devolver la bici (presupuesto inicial rechazado) o la revisión de Óscar */
const porDevolver = o => o.estado === 'cancelada' && o.devuelta === false;
const enRevision = o => o.estado === 'cancelada' && o.revision === 'pendiente';
const isClosed = o => o.estado === 'entregada' || (o.estado === 'cancelada' && !porDevolver(o) && !enRevision(o));
const cancelable = o => !['entregada', 'cancelada'].includes(o.estado);
const cancLabel = o => porDevolver(o) ? 'Cancelada · por devolver' : enRevision(o) ? 'Cancelada · revisión de Óscar' : (o.estado === 'cancelada' && o.devuelta) ? 'Cancelada · devuelta sin cobro' : null;
const group = o => o.estado === 'lista' ? 0 : isClosed(o) ? 2 : 1;
const MID = {reparacion:0, refaccion:1, aprobacion:2, recibida:3, cancelada:4};
function sortOrders(l) {
  return [...l].sort((a, b) => (group(a) - group(b)) || (group(a) === 1 ? (MID[a.estado] - MID[b.estado]) : 0) || b.folio.localeCompare(a.folio));
}
const canGo = (o, to) => to === 'cancelada' ? cancelable(o) : (TRANS[o.estado] || []).includes(to);
function go(o, to, msg, autor = me()) {
  if (!canGo(o, to)) { toast(`Transición no permitida: ${ST[o.estado].label} → ${ST[to].label}`, 'err'); return false; }
  o.estado = to; if (msg) log(o, msg, autor); return true;
}
function log(o, t, a = me(), tag) { o.bit.push(BT(nowLbl(), a, t, tag)); }
/* Precios: el precio base se ajusta en cada presupuesto; si recepción lo cambia, Óscar lo autoriza.
   base === undefined → línea de datos de ejemplo (sin control); base === null → sin precio de catálogo. */
const ajustado = l => !l.prev && !l.propia && l.base !== undefined && (l.base === null || +l.p !== +l.base);
const autPend = p => !!p && p.aut === 'pendiente';
const carga = id => S.orders.filter(o => o.mec === id && ['recibida','aprobacion','reparacion','refaccion'].includes(o.estado)).length;
function refName(r) { if (!r.inv) return r.d || 'Pieza especial'; const it = invOf(r.inv); return `${it.tipo} ${it.variante}`; }
function refLabel(r) {
  if (!r.inv) return (r.d || 'Pieza especial') + (r.especial ? ' (pedido)' : '');
  const it = invOf(r.inv); const q = it.unidad === 'ml' ? ` · ${r.c} ml` : (r.c > 1 ? ` ×${r.c}` : '');
  return `${it.tipo} ${it.variante}${q}`;
}
function refSub(r) {
  if (r.propia) return 'La trae el cliente · solo mano de obra, no se descuenta';
  if (r.especial) return `Pedido especial${r.llego ? ' · llegó' : ' · por llegar'}`;
  const it = invOf(r.inv); return `${r.c} ${it.unidad} × ${money(r.p)}`;
}
const insuf = r => !r.propia && ((r.especial && !r.llego) || (r.inv && r.c > invOf(r.inv).stock));
function getUsadas(o) {
  if (!o.usadas) { const ac = accepted(o); o.usadas = ac ? clone(ac.ref).map(r => { delete r.prev; return r; }) : []; }
  return o.usadas;
}
function faltantes(o, p) { p = p || latest(o); return p ? p.ref.filter(r => !o.piezasOk && insuf(r)) : []; }
const nextFolio = () => 'ORD-' + (Math.max(...S.orders.map(o => +o.folio.split('-')[1])) + 1);
function assign(o, mec) {
  if (o.mec === mec) return;
  const de = o.mec; o.asig.push(AS(de, mec, nowLbl(), me()));
  o.mec = mec;
  log(o, de ? `Reasignada de ${mName(de)} a ${mName(mec)}.` : `Asignada a ${mName(mec)} como responsable.`);
}

/* Operaciones que no se aplican dos veces (pagos y confirmación de piezas) */
function runOp(op) {
  const ex = opById(op.id);
  if (ex && ex.estado === 'guardado') { toast('Esta operación ya estaba guardada; no se aplica dos veces.', 'info'); return; }
  if (ex && ex.estado === 'por_comprobar') { toast('Esta operación está por comprobar. Comprueba antes de repetirla.', 'warn'); return; }
  const o = ex || op; if (!ex) S.ops.push(o);
  if (!S.failSim) { o.apply(); o.estado = 'guardado'; toast(`${o.label} · Guardado`, 'ok'); refresh(); return; }
  o.serverApplied = Math.random() < 0.5; o.estado = 'por_comprobar';
  toast(`${o.label}: sin respuesta del servidor. Comprueba antes de repetir.`, 'warn'); refresh();
}
function checkOp(id) {
  const op = opById(id); if (!op) return;
  if (op.serverApplied) { op.apply(); op.estado = 'guardado'; toast(`Comprobado: ${op.id} sí se guardó. No es necesario repetir.`, 'ok'); }
  else { op.estado = 'no_guardado'; toast(`Comprobado: ${op.id} no se guardó. Puedes reintentar.`, 'err'); }
  refresh();
}
function retryOp(id) { const op = opById(id); if (!op || op.estado !== 'no_guardado') return; op.estado = 'reintentando'; S.ops = S.ops.filter(x => x !== op); runOp(op); }

function finance(o) {
  const lp = latest(o);
  const T = v => `<strong class="text-on-surface font-mono">${money(v)}</strong>`;
  if (o.estado === 'entregada') return [`Cobrado: ${T(total(o))}`, chip('bg-tertiary-container text-tertiary', `Entregada ${o.entregadaF}`, 'verified')];
  if (o.estado === 'cancelada') {
    if (porDevolver(o)) return ['Presupuesto rechazado', chip('bg-error-container text-error', 'Se devuelve sin cobro', 'money_off')];
    if (enRevision(o)) return [`Pagado: ${T(pagado(o))}`, chip('bg-warning-container text-warning', 'Revisión de Óscar', 'gavel')];
    return ['Orden cancelada', chip('bg-surface-muted text-on-surface-variant', o.devuelta ? 'Devuelta sin cobro' : 'Cancelada con motivo', 'block')];
  }
  if (!lp) return ['Sin presupuesto', chip('bg-surface-muted text-on-surface-variant', 'Por cotizar')];
  if (autPend(lp)) return [`Cotizado: ${T(presTotal(lp))}`, chip('bg-warning-container text-warning', 'Precio por autorizar', 'gavel')];
  if (lp.estado === 'pendiente') return [`Cotizado: ${T(presTotal(lp))}`, chip('bg-warning-container text-warning', lp.v > 1 ? `v${lp.v} sin respuesta` : 'Sin respuesta del cliente')];
  const s = saldo(o), pg = pagado(o), L = `Total: ${T(total(o))}`;
  if (s === 0) return [L, chip('bg-success-container text-success', 'Saldo en cero (Liquidado)', 'check')];
  if (o.estado === 'lista') return [L, chip('bg-error-container text-error', `Resta ${money(s)} · entrega con $0`, 'lock')];
  if (pg > 0) return [L, chip('bg-surface-muted text-on-surface-variant', `Abono ${money(pg)} · Resta ${money(s)}`)];
  return [L, chip('bg-surface-muted text-on-surface-variant', 'Sin abonos')];
}

    case 'aprobacion':

function openModal(html, w = 'max-w-2xl', type = 'static', data = {}) {
  S.modal = {type, ...data};
  $('modal').innerHTML = `<div class="fixed inset-0 z-[80] bg-on-surface/30 backdrop-blur-[2px] flex items-start justify-center p-6 overflow-y-auto" onmousedown="if(event.target===this)closeModal()"><div class="bg-surface-card rounded-3xl w-full ${w} my-8 shadow-2xl border border-outline-light pop-in">${html}</div></div>`;
}
function closeModal() { S.modal = null; $('modal').innerHTML = ''; }
function toast(msg, type = 'ok') {
  const st = {ok:['bg-tertiary-dark text-white', 'check_circle'], err:['bg-error text-white', 'error'], warn:['bg-warning text-white', 'sync_problem'], info:['bg-on-surface text-white', 'info']}[type];
  const el = document.createElement('div');
  el.className = `toast-in pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2 max-w-md ${st[0]}`;
  el.innerHTML = `${ic(st[1], 18)}<span>${esc(msg)}</span>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3600);
}

/* ---------- Dispatcher de acciones ---------- */
const ACT_PERM = {asignar:'asignar', llego:'inventario', autorizar:'precios', revisar:'revisar'};
function act(a, f) {
  if (ACT_PERM[a] && !can(ACT_PERM[a])) return soloOscar(ACT_PERM[a]);
  switch (a) {
    case 'detalle': openDetail(f); break;
    case 'bitacora': openDetail(f, 'bitacora'); break;
    case 'etiqueta': openEtiqueta(f); break;
    case 'presupuestar': openEditor(f, 'nuevo'); break;
    case 'editarPres': openEditor(f, 'editar'); break;
    case 'adicional': openEditor(f, 'adicional'); break;
    case 'whatsapp': sendWhats(f); break;
    case 'respuesta': openRespuesta(f); break;
    case 'asignar': openAsignar(f); break;
    case 'llego': openLlegada(f); break;
    case 'cobrar': openCobro(f); break;
    case 'devolver': openDevolver(f); break;
    case 'cancelar': openCancelar(f); break;
    case 'autorizar': openAutorizar(f); break;
    case 'revisar': openRevision(f); break;
    case 'ticket': toast(`Ticket de #${f} enviado a la impresora`, 'info'); break;
  }
}

  const m = {};
  const key = b => [b.marca, b.tipo, b.color, b.rodada, b.serie].join('|').toLowerCase();
  S.orders.forEach(o => { const k = o.cliente.tel; m[k] = m[k] || {...o.cliente, bicis:[]}; if (!m[k].bicis.some(b => key(b) === key(o.bici))) m[k].bicis.push(o.bici); });
  return Object.values(m);
}

/* ---------- Editor de presupuesto ---------- */
let ED = null;
function openEditor(f, mode) {
  const o = byFolio(f);
  if (mode === 'nuevo') {
    if (o.estado !== 'recibida') return toast('Solo las órdenes Recibidas pueden recibir un primer presupuesto', 'err');
    ED = {folio:f, mode, lockedMo:[], lockedRef:[], mo:[], ref:[], motivo:''};
  } else if (mode === 'editar') {
    const lp = latest(o);
    if (!lp || lp.estado !== 'pendiente') return toast('Solo se edita un presupuesto pendiente. La versión aceptada no se modifica.', 'err');
    ED = {folio:f, mode, lockedMo:lp.mo.filter(x => x.prev), lockedRef:lp.ref.filter(x => x.prev), mo:clone(lp.mo.filter(x => !x.prev)), ref:clone(lp.ref.filter(x => !x.prev)), motivo:lp.motivo || ''};
  } else {
    if (!canGo(o, 'aprobacion')) return toast('El daño adicional solo aplica a órdenes En reparación', 'err');
    const ac = accepted(o);
    ED = {folio:f, mode, lockedMo:ac.mo.map(x => ({...x, prev:true})), lockedRef:ac.ref.map(x => ({...x, prev:true})), mo:[], ref:[], motivo:''};
  }
  openModal(`<div id="edBox"></div>`, 'max-w-5xl', 'editor');

  else r[field] = val;

}
function edDel(kind, i) { ED[kind].splice(i, 1); renderEditor(); }

/* ---------- Confirmar piezas (lo usa la vista del mecánico) ---------- */

}

function llegConfirm(f) {
  const o = byFolio(f), us = getUsadas(o);
  us.forEach((r, i) => {
    const el = $('lleg' + i); if (!el) return;
    if (r.especial) { if (el.checked) { r.llego = true; const ac = accepted(o)?.ref.find(x => x.especial && x.d === r.d); if (ac) ac.llego = true; } }
    else { const q = Math.max(0, +el.value || 0); if (q > 0) { invOf(r.inv).stock += q; S.movs.unshift({f:nowLbl(), tipo:'Entrada', inv:r.inv, cant:q, ref:f, usuario:me(), op:uid('OP')}); } }
  });

  go(o, 'reparacion', 'Llegó la pieza; inventario actualizado. Continúa la reparación.');

}

/* ---------- Cobro y entrega ---------- */
function openCobro(f) { openModal(`<div id="cobroBox"></div>`, 'max-w-4xl', 'cobro', {folio:f}); renderCobro(f); }

function pagoAdd(f) {
  const o = byFolio(f), s = saldo(o), monto = Math.round(+$('payMonto').value || 0);
  if (monto <= 0) return toast('Captura un monto válido', 'err');
  if (monto > s) return toast(`El monto excede el saldo (${money(s)})`, 'err');
  if (o.pagos.some(p => ['por_comprobar', 'enviando'].includes(payEstado(p)))) return toast('Comprueba el pago pendiente antes de registrar otro', 'warn');
  const pay = {id:uid('PAG'), fecha:nowLbl(), monto, metodo:S.cobroMetodo, estado:'enviando', opId:uid('OP'), tipo: monto === s ? 'Liquidación' : (o.estado === 'lista' ? 'Abono' : 'Anticipo')};
  o.pagos.push(pay);
  runOp({id:pay.opId, kind:'pago', folio:f, label:`Pago ${money(monto)} #${f}`, apply:() => { pay.estado = 'guardado'; S.stats.semana[pay.metodo] += monto; log(o, `${pay.tipo} de ${money(monto)} en ${pay.metodo.toLowerCase()} (${pay.opId}).`); }});
}
function entregar(f) {
  const o = byFolio(f);
  if (saldo(o) > 0) return toast('Solo se entrega con saldo en cero', 'err');
  if (go(o, 'entregada', `Entregada. Cobrado ${money(total(o))}. Saldo en cero.`)) {
    o.entregadaF = 'hoy'; o.semana = true; o.tiempo = 'Entregada hoy ' + hhmm();
    closeModal(); toast(`#${f} entregada a ${o.cliente.nombre}`, 'ok'); refresh();
  }
}

function openEtiqueta(f) {

/* =========================================================
   VISTA: PRESUPUESTOS
   ========================================================= */
function renderPresupuestos() {
  let all = []; S.orders.forEach(o => o.pres.forEach(p => all.push({o, p})));
  const cnt = e => all.filter(x => x.p.estado === e).length;
  if (S.presTab !== 'todos') all = all.filter(x => x.p.estado === S.presTab);
  const rank = {pendiente:0, aceptado:1, rechazado:2};
  all.sort((a, b) => rank[a.p.estado] - rank[b.p.estado] || (autPend(b.p) - autPend(a.p)) || b.o.folio.localeCompare(a.o.folio) || b.p.v - a.p.v);
  const cards = all.map(({o, p}) => {
    const isLatest = latest(o) === p, f = o.folio;
    const superseded = p.estado === 'aceptado' && o.pres.some(x => x.v > p.v && x.estado === 'aceptado');
    const acts = p.estado === 'pendiente' && isLatest && autPend(p)
      ? `<div class="grid grid-cols-2 gap-2">${btn2('edit', 'Editar', `act('editarPres','${f}')`)}${can('precios') ? btn1('gavel', 'Autorizar precios', `act('autorizar','${f}')`) : btnW('gavel', 'Espera a Óscar', 'Óscar debe autorizar el precio ajustado antes de enviarlo al cliente')}</div>`
      : p.estado === 'pendiente' && isLatest
      ? `<div class="grid grid-cols-3 gap-2">${btn2('edit', 'Editar', `act('editarPres','${f}')`)}${btn2('send', 'WhatsApp', `act('whatsapp','${f}')`)}${btn1('how_to_reg', 'Respuesta', `act('respuesta','${f}')`)}</div>`
      : `<div class="grid grid-cols-1">${btn2('visibility', 'Ver orden', `act('detalle','${f}')`)}</div>`;
    return `<article class="bg-surface-card rounded-3xl p-6 border ${autPend(p) ? 'border-warning ring-1 ring-warning/30' : p.estado === 'pendiente' ? 'border-warning/30' : 'border-outline-light'} flex flex-col gap-4 hover:shadow-md transition-all">
      <div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2"><span class="font-mono text-xs font-bold text-primary tracking-wider bg-primary-container px-2.5 py-1 rounded-full">#${f}</span><span class="font-mono text-[11px] font-bold text-on-surface-variant">v${p.v}</span><span class="text-[11px] text-on-surface-variant">${p.fecha}</span></div>${presChip(p.estado)}</div>
      <div><h2 class="text-base font-semibold tracking-tight">${esc(o.cliente.nombre)}</h2><p class="text-xs text-on-surface-variant">${esc(biciTxt(o.bici))} · ${stChip(o.estado, cancLabel(o), true)}</p></div>
      ${p.motivo ? `<div class="rounded-xl bg-warning-container/60 text-xs px-3 py-2"><strong>Daño adicional:</strong> ${esc(p.motivo)}</div>` : ''}
      <div class="rounded-2xl bg-surface-soft/80 border border-outline-light/60 p-3">${presLines(p)}</div>
      ${superseded ? `<p class="text-[11px] text-on-surface-variant -mt-2">${ic('lock', 12)} Conservada sin cambios; ampliada en una versión posterior.</p>` : ''}
      ${acts}
    </article>`;
  }).join('');

function mvMine() {
  const ord = {reparacion:0, refaccion:1, aprobacion:2, recibida:3, lista:4};
  return S.orders.filter(o => o.mec === S.mv.mec && !isClosed(o) && o.estado !== 'cancelada').sort((a, b) => ord[a.estado] - ord[b.estado]);
}
function mvSet(id) { S.mv = {mec:id, screen:'list', folio:null, msg:null}; refresh(); }
function mvOpen(f) { S.mv.screen = 'detail'; S.mv.folio = f; S.mv.msg = null; refresh(); }
function mvBack() { S.mv.screen = 'list'; S.mv.folio = null; S.mv.msg = null; refresh(); }
function mvQty(i, d) { const o = byFolio(S.mv.folio), r = getUsadas(o)[i], step = r.inv && invOf(r.inv).unidad === 'ml' ? 5 : 1; r.c = Math.max(1, r.c + d * step); S.mv.msg = null; refresh(); }
function mvDel(i) { getUsadas(byFolio(S.mv.folio)).splice(i, 1); S.mv.msg = null; refresh(); }
function mvAdd() { const id = $('mvAddSel').value; if (!id) return; const it = invOf(id); getUsadas(byFolio(S.mv.folio)).push({inv:id, c:it.unidad === 'ml' ? 10 : 1, p:it.precio, propia:false, extra:true}); S.mv.msg = null; refresh(); }
function mvTerminar() {
  const o = byFolio(S.mv.folio), us = getUsadas(o), m = mName(S.mv.mec);
  if (us.some(insuf)) { S.mv.msg = 'blocked'; refresh(); return; }
  piezasConfirm(o.folio, m); S.mv.msg = o.piezasOk ? 'done' : 'pending'; refresh();
}
function mvToRef() { piezasToRef(S.mv.folio, mName(S.mv.mec)); S.mv.msg = null; }
function mvObs() { const v = $('mvObsTxt').value.trim(); if (!v) return; log(byFolio(S.mv.folio), v, mName(S.mv.mec)); toast('Observación guardada', 'ok'); refresh(); }
function mvDanio() {
  const v = $('mvObsTxt').value.trim(); if (!v) return toast('Describe el daño en el campo de observación', 'err');
  const o = byFolio(S.mv.folio); log(o, 'Daño adicional: ' + v, mName(S.mv.mec), 'daño');
  S.avisos.unshift({f:nowLbl(), folio:o.folio, mec:S.mv.mec, txt:'Daño adicional: ' + v});
  toast('Aviso enviado al mostrador para hacer el presupuesto adicional', 'ok'); refresh();
}
function mvCorrSend() {

  S.correcciones.unshift({id:'COR-' + String(n).padStart(3, '0'), mec:S.mv.mec, inv, mov, motivo:mot, ajuste:aj, estado:'pendiente', f:nowLbl()});
  toast('Solicitud enviada. Óscar debe autorizarla.', 'ok'); S.mv.screen = S.mv.folio ? 'detail' : 'list'; refresh();

  const activas = S.orders.filter(o => !isClosed(o)).length;
  const presP = S.orders.filter(o => latest(o)?.estado === 'pendiente').length;
  const corr = S.correcciones.filter(c => c.estado === 'pendiente').length;
  const on = id => S.view === id;
  const badge = (id, n) => `<span class="px-2 py-0.5 rounded-full ${on(id) ? 'bg-primary-dark/40 text-on-primary' : 'bg-surface-muted text-on-surface-variant'} text-xs font-semibold">${n}</span>`;
  const sinMec = S.orders.filter(o => !o.mec && ['reparacion', 'refaccion'].includes(o.estado)).length;
  const items = [
    ['ordenes', 'construction', 'Reparaciones', badge('ordenes', activas)],
    ['presupuestos', 'request_quote', 'Presupuestos', presP ? badge('presupuestos', presP) : ''],
    ['inventario', 'inventory_2', 'Inventario y piezas', corr ? `<span class="w-2 h-2 rounded-full ${on('inventario') ? 'bg-on-primary' : 'bg-primary-light'}"></span>` : ''],
    ['personal', 'group', 'Mecánicos y asignación', sinMec ? badge('personal', sinMec) : ''],
    ['servicios', 'receipt_long', 'Catálogo de servicios', ''],
    ['estadisticas', 'insights', 'Estadísticas', ''],
    ['config', 'settings', 'Configuración', ''],
  ].filter(([id]) => canView(id));
  const R = ROLES[S.role];
  const acct = r => `<button onclick="setRole('${r.id}')" class="flex-1 h-9 rounded-xl text-xs font-semibold transition-all ${S.role === r.id ? 'bg-primary text-on-primary shadow-xs' : 'text-on-surface-variant hover:bg-surface-muted'}">${r.id === 'oscar' ? 'Óscar' : 'Recepción'}</button>`;
  const link = ([id, icon, label, right]) => `<a href="#" onclick="event.preventDefault();goView('${id}')" class="flex items-center justify-between px-3.5 py-2.5 rounded-full text-sm transition-all ${on(id) ? 'bg-primary text-on-primary font-medium shadow-sm' : 'text-on-surface-variant hover:bg-surface-soft hover:text-on-surface'}"><div class="flex items-center gap-3">${ic(icon, 19)}<span>${label}</span></div>${right}</a>`;
  $('sidebar').innerHTML = `<div class="flex flex-col">
    <div class="h-20 px-6 flex items-center gap-3 border-b border-outline-light"><div class="w-10 h-10 rounded-2xl bg-primary-container text-primary flex items-center justify-center font-serif text-2xl font-semibold shadow-xs">T</div><div class="flex flex-col"><span class="font-serif text-lg text-on-surface font-medium tracking-tight">${esc(S.tallerNombre)}</span><span class="text-[11px] font-semibold tracking-wider text-on-surface-variant uppercase">Taller de bicicletas</span></div></div>
    <nav class="flex flex-col gap-1.5 p-4 mt-2">${items.map(link).join('')}
      <div class="mt-4 mb-1 px-3.5 ${LBL10}">Demostración</div>
      ${link(['mecanico', 'smartphone', 'Pantalla del mecánico', ''])}
    </nav></div>
    <div class="p-4 border-t border-outline-light flex flex-col gap-2">
      <div class="p-2.5 rounded-2xl bg-surface-soft flex items-center gap-2.5"><div class="w-9 h-9 rounded-full ${S.role === 'oscar' ? 'bg-primary text-on-primary' : 'bg-tertiary-container text-tertiary'} flex items-center justify-center font-semibold text-xs shrink-0">${R.ini}</div><div class="flex flex-col min-w-0"><span class="text-xs font-semibold text-on-surface leading-tight truncate">${esc(R.nombre)}</span><span class="text-[10px] text-on-surface-variant font-medium">@${R.usuario} · ${R.rol} · PC mostrador</span></div></div>
      <div><div class="${LBL10} px-1 mb-1">Demostración · cambiar de cuenta</div><div class="flex gap-1 p-1 rounded-2xl bg-surface-soft border border-outline-light">${acct(ROLES.recepcion)}${acct(ROLES.oscar)}</div></div>
    </div>`;
}
function setRole(r) {
  if (S.role === r) return;
  S.role = r; closeModal(); closeDetail(); toggleNotif(false);
  if (!canView(S.view)) S.view = 'ordenes';
  toast(`Sesión iniciada como ${ROLES[r].nombre}`, 'info'); refresh();
}
function notifs() {
  const n = [];
  S.avisos.forEach(a => n.push({icon:'report', cls:'bg-warning-container text-warning', t:`${mName(a.mec)} · #${a.folio}`, s:a.txt, f:a.f, on:`act('detalle','${a.folio}')`}));
  if (can('precios')) S.orders.filter(o => autPend(latest(o))).forEach(o => n.push({icon:'gavel', cls:'bg-warning-container text-warning', t:`#${o.folio} · precio ajustado por autorizar`, s:`${o.cliente.nombre} · ${money(presTotal(latest(o)))}`, f:o.tiempo, on:`act('autorizar','${o.folio}')`}));
  if (can('revisar')) S.orders.filter(enRevision).forEach(o => n.push({icon:'gavel', cls:'bg-warning-container text-warning', t:`#${o.folio} · cancelación por revisar`, s:o.cancel.motivo, f:o.cancel.f, on:`act('revisar','${o.folio}')`}));
  if (can('asignar')) S.orders.filter(o => !o.mec && ['reparacion', 'refaccion'].includes(o.estado)).forEach(o => n.push({icon:'person_add', cls:'bg-primary-container text-primary', t:`#${o.folio} · sin mecánico responsable`, s:o.cliente.nombre, f:o.tiempo, on:`act('asignar','${o.folio}')`}));
  if (can('correcciones')) S.correcciones.filter(c => c.estado === 'pendiente').forEach(c => n.push({icon:'rule', cls:'bg-info-container text-info', t:'Corrección de inventario por autorizar', s:`${mName(c.mec)} · ${invName(c.inv)} (${c.ajuste > 0 ? '+' : ''}${c.ajuste})`, f:c.f, on:`goView('inventario','solicitudes')`}));
  S.orders.filter(o => latest(o)?.estado === 'pendiente' && !autPend(latest(o)) && o.estado === 'aprobacion').forEach(o => n.push({icon:'schedule', cls:'bg-surface-muted text-on-surface-variant', t:`#${o.folio} espera respuesta del cliente`, s:`${o.cliente.nombre} · ${money(presTotal(latest(o)))}`, f:o.tiempo, on:`act('respuesta','${o.folio}')`}));
  S.orders.filter(o => o.estado === 'lista').forEach(o => n.push({icon:'task_alt', cls:'bg-success-container text-success', t:`#${o.folio} lista para entregar`, s:`${o.cliente.nombre} · ${saldo(o) > 0 ? 'Resta ' + money(saldo(o)) : 'Saldo en cero'}`, f:o.tiempo, on:`act('cobrar','${o.folio}')`}));
  return n;
}
function renderNotif() {
  const n = notifs();
  $('notifDot').style.display = S.avisos.length || (can('correcciones') && S.correcciones.some(c => c.estado === 'pendiente')) || (can('precios') && S.orders.some(o => autPend(latest(o)))) ? '' : 'none';
  $('notifPanel').innerHTML = `<div class="px-5 py-4 flex items-center justify-between border-b border-outline-light"><span class="font-serif text-lg">Notificaciones</span>${S.avisos.length ? `<button onclick="S.avisos=[];refresh()" class="text-[11px] font-semibold text-primary hover:underline">Marcar avisos como vistos</button>` : ''}</div>
    <div class="max-h-[420px] overflow-y-auto p-2">${n.map(x => `<button onclick="toggleNotif(false);${x.on}" class="w-full text-left flex gap-3 p-3 rounded-2xl hover:bg-surface-soft"><div class="w-8 h-8 rounded-xl ${x.cls} flex items-center justify-center shrink-0">${ic(x.icon, 17)}</div><div class="min-w-0"><div class="text-xs font-semibold">${esc(x.t)}</div><div class="text-[11px] text-on-surface-variant truncate">${esc(x.s)}</div><div class="text-[10px] text-on-surface-variant/70">${esc(x.f)}</div></div></button>`).join('') || '<p class="text-xs text-on-surface-variant p-4">Sin notificaciones.</p>'}</div>`;
}
function toggleNotif(force) { const p = $('notifPanel'); const show = force ?? p.classList.contains('hidden'); p.classList.toggle('hidden', !show); }
function renderRole() {
  const R = ROLES[S.role];
  $('roleChip').className = `h-9 px-3.5 rounded-full text-[11px] font-semibold flex items-center gap-1.5 ${S.role === 'oscar' ? 'bg-primary text-on-primary' : 'bg-tertiary-container text-tertiary'}`;
  $('roleChip').innerHTML = `${ic(S.role === 'oscar' ? 'admin_panel_settings' : 'storefront', 15)} ${S.view === 'mecanico' ? 'Demostración: celular' : 'Cuenta: ' + esc(R.nombre)}`;
}
function renderConn() {
  $('connChip').className = `h-9 px-3.5 rounded-full text-[11px] font-semibold flex items-center gap-1.5 transition-colors ${S.failSim ? 'bg-warning-container text-warning' : 'bg-success-container text-success'}`;
  $('connChip').innerHTML = S.failSim ? `${ic('wifi_off', 15)} Fallo simulado` : `${ic('wifi', 15)} Conexión normal`;
}
function opsBanner() {
  const ops = S.ops.filter(o => o.estado !== 'guardado'); if (!ops.length) return '';
  return `<div class="rounded-3xl border border-warning/30 bg-warning-container/70 p-4 flex flex-col gap-2">
    <div class="flex items-center gap-2 text-warning text-sm font-semibold">${ic('sync_problem', 18)} Operaciones sin confirmar</div>
    <p class="text-xs text-on-surface-variant -mt-1">Comprueba si se guardaron antes de repetirlas. Cada operación tiene un identificador único y no se aplica dos veces.</p>
    ${ops.map(op => `<div class="flex items-center justify-between gap-3 bg-surface-card rounded-2xl px-4 py-2.5"><div class="flex items-center gap-3 text-xs min-w-0"><span class="font-mono font-bold text-primary">${op.id}</span><span class="truncate">${esc(op.label)}</span>${opChip(op.estado)}</div>${op.estado === 'por_comprobar' ? Bsm('Comprobar', `checkOp('${op.id}')`, 'fact_check') : Bsm('Reintentar', `retryOp('${op.id}')`, 'refresh')}</div>`).join('')}
  </div>`;
}

/* =========================================================
   NAVEGACIÓN Y RENDER
   ========================================================= */
const VIEWS = {ordenes:renderOrdenes, presupuestos:renderPresupuestos, inventario:renderInventario, personal:renderPersonal, servicios:renderServicios, estadisticas:renderEstadisticas, config:renderConfig, mecanico:renderMecanico};
function goView(v, tab) { if (!canView(v)) return soloOscar(VIEW_PERM[v]); uxCloseNav(); S.view = v; if (tab && v === 'inventario') S.invTab = tab; if (tab && v === 'presupuestos') S.presTab = tab; closeDetail(); toggleNotif(false); window.scrollTo(0, 0); refresh(); }
function onSearch(v) { S.search = v; if (S.view !== 'ordenes') { S.view = 'ordenes'; refresh(); } else { $('main').innerHTML = opsBanner() + renderOrdenes(); } }
function clearSearch() { S.search = ''; $('orderSearchInput').value = ''; refresh(); }
function printComandas() { toast(`Imprimiendo comandas de ${S.orders.filter(o => ['reparacion', 'refaccion'].includes(o.estado)).length} órdenes en taller`, 'info'); }
function refresh() {
  if (!canView(S.view)) S.view = 'ordenes';
  renderSidebar(); renderRole(); renderConn(); renderNotif();
  $('main').innerHTML = (S.view !== 'mecanico' ? opsBanner() : '') + VIEWS[S.view]();
  $('fab').style.display = S.view === 'mecanico' ? 'none' : 'flex';
  if (S.drawer) renderDetail();
  if (S.modal?.type === 'cobro') renderCobro(S.modal.folio);
}

document.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if (e.key === 'Escape') { if ($('uxTour').classList.contains('open')) { uxTourClose(); return; } uxCloseNav(); if (S.modal) closeModal(); else if (S.drawer) closeDetail(); else toggleNotif(false); return; }
  if (typing || S.modal || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); $('orderSearchInput').focus(); }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNuevaOrden(); }
});
document.addEventListener('click', e => { if (!$('notifWrap').contains(e.target)) toggleNotif(false); });

/* Guía contextual sin alterar las reglas de negocio existentes */
const UX_STEPS = [
  {title:'Bienvenido a Taller al Día', text:'Demostración con datos ficticios. El mostrador tiene dos cuentas separadas: Recepción y Óscar. Puede cambiar de cuenta abajo a la izquierda.', view:'ordenes', role:'recepcion'},
  {title:'1. Recepción registra la bicicleta', text:'Con el botón «Registrar bicicleta» se capturan el nombre y teléfono del cliente; la marca, tipo, color, rodada y número de serie (si lo tiene); cómo llega y qué trabajo pide. Se busca por folio, nombre o teléfono.', view:'ordenes', role:'recepcion'},
  {title:'2. Recepción hace el presupuesto', text:'Mano de obra y refacciones por separado. Si recepción cambia un precio del catálogo, el presupuesto queda «Precio por autorizar» y no se envía al cliente hasta que Óscar lo autorice. Recepción también cobra y entrega con saldo en cero.', view:'presupuestos', role:'recepcion'},
  {title:'3. El mecánico trabaja desde su celular', text:'Cada mecánico ve solo sus órdenes, anota observaciones, confirma las piezas que realmente usó (se descuentan una sola vez) y solicita correcciones de inventario.', view:'mecanico', role:'recepcion'},
  {title:'4. Cuenta de Óscar', text:'Óscar puede hacer todo lo de recepción y, además, autorizar precios y correcciones de inventario y modificar el catálogo. Asignar mecánicos, administrar el inventario y ver estadísticas quedaron solo en su cuenta (supuesto por validar).', view:'ordenes', role:'oscar'},
  {title:'5. Inventario y estadísticas', text:'Existencias por variante con un solo mínimo de reposición; bandeja de correcciones para autorizar. En Estadísticas: ingresos cobrados por semana y trabajos pendientes y terminados.', view:'inventario', role:'oscar'}
];
let uxStep = 0;
function uxToggleNav() { document.body.classList.toggle('ux-nav-open'); }
function uxCloseNav() { document.body.classList.remove('ux-nav-open'); }
function uxTourOpen() { uxStep=0; $('uxTour').classList.add('open'); uxTourRender(); }
function uxTourClose() { $('uxTour').classList.remove('open'); }
function uxTourMove(delta) { if (uxStep+delta>=UX_STEPS.length) { uxTourClose(); return; } uxStep=Math.max(0,uxStep+delta); uxTourRender(); }
function uxTourRender() {
  const s=UX_STEPS[uxStep]; $('uxTourCount').textContent=`Paso ${uxStep+1} de ${UX_STEPS.length}`;
  $('uxTourTitle').textContent=s.title; $('uxTourText').textContent=s.text;
  $('uxTourBack').disabled=uxStep===0; $('uxTourBack').style.opacity=uxStep===0?'.35':'1';
  $('uxTourNext').textContent=uxStep===UX_STEPS.length-1?'Finalizar':'Siguiente';
  if (s.role && S.role!==s.role) { S.role=s.role; closeModal(); closeDetail(); }
  if (S.view!==s.view) goView(s.view); else refresh();
}
refresh();
</script>
</body></html>
